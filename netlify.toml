# Netlify reads this file instead of the dashboard build settings.
# "npm run build" = build the app, then write the real HTML pages, sitemap.xml and llms.txt (scripts/prerender.ts).
[build]
  command = "npm run build"
  publish = "dist"

# the offline helper must always be re-checked so updates reach visitors
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
