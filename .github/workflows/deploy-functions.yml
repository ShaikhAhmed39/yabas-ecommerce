# Uploads every function in supabase/functions to Supabase.
# Runs by itself after a merge into main, and by hand from GitHub -> Actions -> "Deploy Supabase functions" -> Run workflow.
# Needs ONE GitHub secret: SUPABASE_ACCESS_TOKEN (Supabase -> Account -> Access Tokens -> Generate new token).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        run: supabase functions deploy --project-ref abfzhqhxfmnxflapknjn --use-api --yes
